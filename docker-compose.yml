version: '3.8'

services:
  # Base de datos PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: bvc_postgres
    environment:
      POSTGRES_DB: bvc_analysis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bvc_secure_password_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Backend FastAPI
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bvc_backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: bvc_analysis
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-bvc_secure_password_2026}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command: >
      sh -c "
        echo 'Esperando a PostgreSQL...' &&
        sleep 5 &&
        echo 'Iniciando servidor...' &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000
      "

  # Frontend React (OPCIONAL - Solo para desarrollo local)
  # Para producción, se recomienda usar Vercel (gratis, más rápido)
  # Ver: DESPLIEGUE_FRONTEND.md
  #
  # frontend:
  #   image: node:18-alpine
  #   container_name: bvc_frontend
  #   working_dir: /app
  #   volumes:
  #     - ./frontend:/app
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     - REACT_APP_API_URL=http://localhost:8000
  #   command: sh -c "npm install && npm start"
  #   depends_on:
  #     - backend

volumes:
  postgres_data:
    driver: local
